name: Build XSign Multitask IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      ARCHIVE_PATH: ${{ github.workspace }}/build/LiveContainer.xcarchive
      XSIGN_IPA_URL: https://github.com/DeltaExploiting/Esigning/releases/download/2727/00008110-0009395E26C0E01E_xsign.2.ipa

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 1

      - name: Download signed XSign IPA
        run: |
          set -euxo pipefail
          curl -fL "$XSIGN_IPA_URL" -o "$GITHUB_WORKSPACE/XSign-3.6.6-signed.ipa"
          test -s "$GITHUB_WORKSPACE/XSign-3.6.6-signed.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/XSign-3.6.6-signed.ipa"

      - name: Checkout LiveContainer
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveContainer
          path: LiveContainer
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Configure XSign
        run: python3 site/scripts/patch_xsign.py LiveContainer

      - name: Show patch
        run: grep -n 'co.xsign\|uiDontSign\|uiIsJITNeeded\|uiIsMultitaskModeSpecificed' LiveContainer/LiveContainerSwiftUI/Models/LCAppModel.swift

      - name: Resolve packages
        working-directory: LiveContainer
        run: xcodebuild -resolvePackageDependencies -project LiveContainer.xcodeproj -scheme LiveContainer

      - name: Archive unsigned IPA
        working-directory: LiveContainer
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Bundle signed XSign into LiveContainer
        run: |
          set -euxo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/LiveContainer.app"
          test -d "$APP"
          cp "$GITHUB_WORKSPACE/XSign-3.6.6-signed.ipa" "$APP/XSign-3.6.6-signed.ipa"
          test -s "$APP/XSign-3.6.6-signed.ipa"
          ls -lh "$APP/XSign-3.6.6-signed.ipa"

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/LiveContainer.app"
          test -d "$APP"
          rm -rf Payload MultitaskContainer-XSign-unsigned.ipa
          mkdir Payload
          ditto "$APP" Payload/LiveContainer.app
          zip -qry MultitaskContainer-XSign-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MultitaskContainer-XSign-bundled
          path: MultitaskContainer-XSign-unsigned.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsign-multitask-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
