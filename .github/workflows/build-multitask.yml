name: Build Multitask IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LiveContainer multitask IPA
    runs-on: macos-latest
    env:
      SCHEME: LiveContainer
      ARCHIVE_PATH: ${{ github.workspace }}/build/LiveContainer.xcarchive

    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout upstream LiveContainer
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveContainer
          path: LiveContainer
          submodules: recursive
          fetch-depth: 1

      - name: Show build inputs
        working-directory: LiveContainer
        run: |
          set -euxo pipefail
          xcodebuild -version
          test -d LiveContainer.xcodeproj
          xcodebuild -list -project LiveContainer.xcodeproj

      - name: Resolve Swift packages
        working-directory: LiveContainer
        run: |
          set -euxo pipefail
          xcodebuild -resolvePackageDependencies \
            -project LiveContainer.xcodeproj \
            -scheme "$SCHEME"

      - name: Archive unsigned app
        working-directory: LiveContainer
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/LiveContainer.app"
          test -d "$APP_PATH"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          ditto "$APP_PATH" "$GITHUB_WORKSPACE/Payload/LiveContainer.app"
          cd "$GITHUB_WORKSPACE"
          /usr/bin/zip -qry "MultitaskContainer-unsigned.ipa" Payload
          test -s "MultitaskContainer-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MultitaskContainer-unsigned-ipa
          path: MultitaskContainer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitask-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
