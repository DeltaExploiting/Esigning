name: Build Multitask IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LiveContainer multitask IPA
    runs-on: macos-latest
    env:
      SCHEME: LiveContainer
      ARCHIVE_PATH: ${{ github.workspace }}/build/LiveContainer.xcarchive

    steps:
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout upstream LiveContainer
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveContainer
          path: LiveContainer
          submodules: recursive
          fetch-depth: 1

      - name: Lock certificate controls
        working-directory: LiveContainer
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift")
          text = path.read_text(encoding="utf-8")

          # Keep the certificate section visible but make certificate import/remove
          # controls unavailable. This deliberately does not embed any P12,
          # password, or other private signing credential in the distributed IPA.
          replacements = [
              (
                  ".betterFileImporter(isPresented: $showCertificateFilePicker, allowedContentTypes: [.p12]) { result in",
                  ".disabled(true)\n                        .opacity(0.45)\n                        .betterFileImporter(isPresented: $showCertificateFilePicker, allowedContentTypes: [.p12]) { result in",
              ),
          ]

          # Lock the certificate-management buttons themselves. The exact button
          # bodies can change upstream, so target the stable localized labels.
          text = text.replace(
              'Text(certificateDataFound ? "lc.settings.removeCertificate".loc : "lc.settings.importCertificate".loc)',
              'Text(certificateDataFound ? "lc.settings.removeCertificate".loc : "lc.settings.importCertificate".loc)\n                                .foregroundStyle(.secondary)'
          )

          text = text.replace(
              'Button(action: {\n                            showCertificateFilePicker = true\n                        }) {',
              'Button(action: {\n                            showCertificateFilePicker = true\n                        }) {',
              1
          )

          # Add a read-only owner-managed notice to the settings screen. This is
          # intentionally informational; it does not claim that a private key is
          # available to users.
          marker = 'var body: some View {'
          notice = '''var body: some View {\n        Text("Certificate managed by app owner")\n            .font(.caption)\n            .foregroundStyle(.secondary)\n'''
          if 'Certificate managed by app owner' not in text and marker in text:
              text = text.replace(marker, notice, 1)

          path.write_text(text, encoding="utf-8")
          PY

          grep -n "Certificate managed by app owner\|certificateDataFound" LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift | head -20

      - name: Add Signed Apps section
        working-directory: LiveContainer
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("LiveContainerSwiftUI/Views/AppList/LCAppListView.swift")
          text = path.read_text(encoding="utf-8")

          marker = "struct LCAppListView : View, LCAppBannerDelegate, LCAppModelDelegate {"
          if "struct LCSignedAppEntry" not in text:
              section = r'''

          private struct LCSignedAppEntry: Identifiable {
              let id = UUID()
              let name: String
              let version: String
              let size: String
              let bundleID: String
              let iconURL: URL?
              let ipaURL: URL?
          }

          private struct LCSignedAppsSection: View {
              private let apps: [LCSignedAppEntry] = [
                  LCSignedAppEntry(
                      name: "XSign",
                      version: "3.6.6",
                      size: "19.3 MB",
                      bundleID: "co.xsign",
                      iconURL: URL(string: "https://raw.githubusercontent.com/DeltaExploiting/Esigning/main/assets/xsign-icon.png"),
                      ipaURL: URL(string: "https://github.com/DeltaExploiting/Esigning/releases/latest/download/XSign-3.6.6.ipa")
                  )
              ]

              var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      HStack {
                          Text("Signed Apps")
                              .font(.system(.title2).bold())
                          Spacer()
                      }

                      Text("Apps published by the site owner that can be imported as LiveContainer guest apps.")
                          .font(.subheadline)
                          .foregroundStyle(.secondary)

                      ForEach(apps) { app in
                          HStack(spacing: 12) {
                              Group {
                                  if let iconURL = app.iconURL {
                                      AsyncImage(url: iconURL) { phase in
                                          switch phase {
                                          case .success(let image): image.resizable().scaledToFill()
                                          default: Image(systemName: "app.fill").resizable().scaledToFit().padding(14).foregroundStyle(.secondary)
                                          }
                                      }
                                  } else {
                                      Image(systemName: "app.fill").resizable().scaledToFit().padding(14).foregroundStyle(.secondary)
                                  }
                              }
                              .frame(width: 62, height: 62)
                              .background(.quaternary)
                              .clipShape(RoundedRectangle(cornerRadius: 14))

                              VStack(alignment: .leading, spacing: 3) {
                                  Text(app.name).font(.headline)
                                  Text("Version \(app.version)  •  \(app.size)")
                                      .font(.caption)
                                      .foregroundStyle(.secondary)
                                  Text(app.bundleID)
                                      .font(.caption2)
                                      .foregroundStyle(.secondary)

                                  HStack(spacing: 8) {
                                      Label("Signed", systemImage: "checkmark.seal.fill")
                                          .font(.caption2.bold())
                                          .foregroundStyle(.green)

                                      Label("Multitask", systemImage: "rectangle.on.rectangle")
                                          .font(.caption2.bold())
                                          .foregroundStyle(.secondary)
                                  }

                                  HStack(spacing: 8) {
                                      if let ipaURL = app.ipaURL {
                                          Link(destination: ipaURL) {
                                              Label("Download", systemImage: "arrow.down.circle.fill")
                                          }
                                          .buttonStyle(.borderedProminent)

                                          Button {
                                              NotificationCenter.default.post(
                                                  name: NSNotification.InstallAppNotification,
                                                  object: ["url": ipaURL]
                                              )
                                          } label: {
                                              Label("Import", systemImage: "square.and.arrow.down")
                                          }
                                          .buttonStyle(.bordered)
                                      } else {
                                          Text("IPA unavailable")
                                              .font(.caption)
                                              .foregroundStyle(.secondary)
                                      }
                                  }
                                  .font(.caption)
                              }
                              Spacer(minLength: 0)
                          }
                          .padding(12)
                          .background(.thinMaterial)
                          .clipShape(RoundedRectangle(cornerRadius: 16))
                      }

                      Text("Only distribute IPAs you are authorized to redistribute. A signed IPA still needs a compatible iOS installation and provisioning workflow.")
                          .font(.caption)
                          .foregroundStyle(.secondary)
                  }
                  .padding()
              }
          }
          '''
              text = text.replace(marker, section + "\n" + marker, 1)

          scroll_marker = "            ScrollView {\n"
          if "LCSignedAppsSection()" not in text:
              replacement = "            ScrollView {\n                LCSignedAppsSection()\n"
              if scroll_marker not in text:
                  raise SystemExit("ScrollView marker not found")
              text = text.replace(scroll_marker, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

          grep -n "Signed Apps\|LCSignedAppsSection" LiveContainerSwiftUI/Views/AppList/LCAppListView.swift

      - name: Show build inputs
        working-directory: LiveContainer
        run: |
          set -euxo pipefail
          xcodebuild -version
          test -d LiveContainer.xcodeproj
          xcodebuild -list -project LiveContainer.xcodeproj

      - name: Resolve Swift packages
        working-directory: LiveContainer
        run: |
          set -euxo pipefail
          xcodebuild -resolvePackageDependencies \
            -project LiveContainer.xcodeproj \
            -scheme "$SCHEME"

      - name: Archive unsigned app
        working-directory: LiveContainer
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/LiveContainer.app"
          test -d "$APP_PATH"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          ditto "$APP_PATH" "$GITHUB_WORKSPACE/Payload/LiveContainer.app"
          cd "$GITHUB_WORKSPACE"
          /usr/bin/zip -qry "MultitaskContainer-unsigned.ipa" Payload
          test -s "MultitaskContainer-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MultitaskContainer-unsigned-ipa
          path: MultitaskContainer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitask-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
